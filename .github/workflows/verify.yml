name: Verify

# v2.9.1 validation gate (PROTOCOL.md §9.3): privacy scan, typecheck, and tests.
# Reads no GitHub state and needs no secrets. Every pushed source file is
# scanned. Issue-derived projections (INDEX.md, not_indexed.md, weights.json,
# REGION-*.md, okf/) mirror the private Issues store and are skipped here;
# `npm run public:check` scans them and fails closed on any that are non-empty.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret and privacy scan
        run: npm run secrets:scan:all

      - name: Typecheck
        run: npm run typecheck

      - name: Test (builds via pretest)
        run: npm test
