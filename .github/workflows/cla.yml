name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla_assistant:
    runs-on: ubuntu-latest
    # Run on every PR event, or when someone posts the magic sign-off comment
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))

    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a PAT here if you want signatures committed by a bot
          # account rather than the built-in Actions token.
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_PAT }}
        with:
          # URL contributors click to read the CLA
          path-to-document: >-
            https://github.com/${{ github.repository }}/blob/main/CLA.md

          # Where signatures are stored in this repo (committed to main)
          path-to-signatures: signatures/cla.json
          branch: main

          # The exact comment contributors must post to sign
          signed-commit-message: >-
            $contributorName has signed the CLA in $owner/$repo#$pullRequestNo

          custom-pr-sign-comment: >-
            I have read the CLA Document and I hereby sign the CLA

          # Allow the Maintainer's own PRs through without signing,
          # and skip CLA for bot accounts (dependabot, github-actions, ...)
          allowlist: HoHo1979,*[bot]
